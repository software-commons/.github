name: SCES policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['sces-v*']

permissions:
  contents: read

jobs:
  policy:
    name: SCES policy qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Verify policy bundle and run adversarial fixtures
        run: |
          python -m pip install --disable-pip-version-check -r tools/sces/requirements.txt
          python tools/sces/validate.py --policy-only
          python -m unittest discover -s tests/sces -v
